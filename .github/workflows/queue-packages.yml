name: Queue Avernella packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: avernella-packaging-trigger-${{ github.sha }}
  cancel-in-progress: false

jobs:
  queue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request reconciliation on packaging main
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'The scheduled packaging workflows will pick up this commit.'
            exit 0
          fi
          for workflow in packages.yml source-formats.yml; do
            gh workflow run "$workflow" --repo novesce/avernella-packaging --ref main
          done
